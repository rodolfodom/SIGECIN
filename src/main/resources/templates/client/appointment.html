<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{appointment.title})}"></head>
<body class="d-flex flex-column min-vh-100" th:with="a = ${appointment}, business = ${appointment.service.business}">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div class="form-page mx-auto">
        <div th:replace="~{layout/base :: flash}"></div>
        <a class="small" th:href="@{/appointments}" th:text="#{appointment.back-to-list}">← Mis citas</a>

        <div class="card shadow-sm mt-2">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
                    <h1 class="h4 mb-0" th:text="${a.service.name}">Corte clásico</h1>
                    <span th:replace="~{layout/base :: appointmentStatus(${a.status})}"></span>
                </div>
                <div th:replace="~{client/appointment :: details}"></div>
            </div>
        </div>

        <div class="card shadow-sm mt-3" th:if="${a.isCancellable(now)}">
            <div class="card-body p-4">
                <h2 class="h6" th:text="#{appointment.cancel.title}">Cancelar la cita</h2>
                <form th:action="@{/appointments/{id}/cancel(id=${a.id})}" method="post" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="reasonId" class="form-label small" th:text="#{field.appointment.reason}">Motivo</label>
                        <select class="form-select" id="reasonId" name="reasonId" required>
                            <option value="" th:text="#{action.select}">Selecciona…</option>
                            <option th:each="r : ${reasons}" th:value="${r.id}" th:text="${r.name}">Motivo</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-outline-danger" th:text="#{appointment.cancel.submit}">Cancelar cita</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>

<!--/* Datos de la cita; el detalle del negocio reutiliza este fragmento */-->
<th:block th:remove="all">
    <dl th:fragment="details" class="row mb-0">
        <dt class="col-sm-4" th:text="#{field.appointment.business}">Negocio</dt>
        <dd class="col-sm-8">
            <a th:href="@{/businesses/{id}(id=${business.id})}" th:text="${business.name}">Barbería</a>
        </dd>
        <dt class="col-sm-4" th:text="#{field.appointment.client}">Cliente</dt>
        <dd class="col-sm-8" th:text="${a.client.fullName}">Carlos</dd>
        <dt class="col-sm-4" th:text="#{field.appointment.date}">Fecha</dt>
        <dd class="col-sm-8" th:text="${#temporals.format(a.startTime, 'EEEE d ''de'' MMMM ''de'' yyyy')}">lunes 12 de octubre</dd>
        <dt class="col-sm-4" th:text="#{field.appointment.time}">Hora</dt>
        <dd class="col-sm-8" th:text="|${#temporals.format(a.startTime, 'HH:mm')} – ${#temporals.format(a.endTime, 'HH:mm')}|">10:00 – 10:30</dd>
        <dt class="col-sm-4" th:text="#{field.appointment.price}">Precio</dt>
        <dd class="col-sm-8" th:text="${'$' + #numbers.formatDecimal(a.priceAtBooking, 1, 'COMMA', 2, 'POINT')}">$120.00</dd>
        <dt class="col-sm-4" th:text="#{field.appointment.notes}">Notas</dt>
        <dd class="col-sm-8" th:text="${a.clientNotes} ?: #{value.none}">—</dd>
        <th:block th:if="${a.cancelledReason}">
            <dt class="col-sm-4" th:text="#{field.appointment.reason}">Motivo</dt>
            <dd class="col-sm-8 mb-0" th:text="${a.cancelledReason.name}">Motivo</dd>
        </th:block>
    </dl>
</th:block>
</body>
</html>
