<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{favorite.list.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{layout/base :: flash}"></div>
    <h1 class="h3 mb-4" th:text="#{favorite.list.title}">Mis favoritos</h1>

    <div th:if="${favorites.isEmpty()}" class="card shadow-sm">
        <div class="card-body text-center py-5">
            <p class="mb-3 text-body-secondary" th:text="#{favorite.list.empty}">Aún no tienes favoritos.</p>
            <a class="btn btn-primary" th:href="@{/businesses}" th:text="#{favorite.list.explore}">Buscar negocios</a>
        </div>
    </div>

    <div class="list-group shadow-sm" th:unless="${favorites.isEmpty()}">
        <div class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2 py-3"
             th:each="entry : ${favorites}" th:with="business = ${entry.business()}">
            <div>
                <a th:if="${entry.available()}" class="fw-semibold" th:href="@{/businesses/{id}(id=${business.id})}"
                   th:text="${business.name}">Barbería El Estilo</a>
                <span th:unless="${entry.available()}" class="fw-semibold text-body-secondary" th:text="${business.name}">Negocio</span>
                <span class="badge rounded-pill text-bg-light border ms-1" th:text="${business.category.name}">Barbería</span>
                <span th:unless="${entry.available()}" class="badge rounded-pill text-bg-secondary ms-1"
                      th:text="#{favorite.unavailable}">No disponible</span>
                <div class="small text-body-secondary" th:if="${business.address}" th:text="${business.address}">Dirección</div>
            </div>
            <form th:action="@{/favorites/{id}/remove(id=${business.id})}" method="post">
                <input type="hidden" name="redirect" th:value="@{/favorites}">
                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{favorite.list.remove}">Quitar</button>
            </form>
        </div>
    </div>
    <p class="small text-body-secondary mt-3" th:if="${hasUnavailable}" th:text="#{favorite.list.note}">Nota</p>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
