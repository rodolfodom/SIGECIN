<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{business.schedule.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div class="form-page mx-auto">
        <div th:replace="~{layout/base :: flash}"></div>
        <h1 class="h3 mb-1" th:text="#{business.schedule.title}">Horario de atención</h1>
        <p class="text-body-secondary mb-4" th:text="#{business.schedule.intro}">Marca los días que abres.</p>

        <form th:action="@{/business/schedule}" th:object="${scheduleForm}" method="post" class="needs-validation" novalidate>
            <div class="card shadow-sm">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item py-3" th:each="day, row : *{days}">
                        <input type="hidden" th:field="*{days[__${row.index}__].day}">
                        <div class="row g-2 align-items-start">
                            <div class="col-12 col-sm-4 pt-sm-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch"
                                           th:field="*{days[__${row.index}__].open}" th:id="|open-${row.index}|">
                                    <label class="form-check-label fw-semibold" th:for="|open-${row.index}|"
                                           th:text="#{|day.${day.day}|}">Lunes</label>
                                </div>
                            </div>
                            <div class="col-6 col-sm-4">
                                <label class="form-label small mb-1" th:for="|openTime-${row.index}|" th:text="#{field.schedule.open}">Abre</label>
                                <input type="time" class="form-control" th:id="|openTime-${row.index}|"
                                       th:field="*{days[__${row.index}__].openTime}" th:errorclass="is-invalid"
                                       th:data-required-when="|open-${row.index}|">
                                <div class="invalid-feedback" th:errors="*{days[__${row.index}__].openTime}"></div>
                            </div>
                            <div class="col-6 col-sm-4">
                                <label class="form-label small mb-1" th:for="|closeTime-${row.index}|" th:text="#{field.schedule.close}">Cierra</label>
                                <input type="time" class="form-control" th:id="|closeTime-${row.index}|"
                                       th:field="*{days[__${row.index}__].closeTime}" th:errorclass="is-invalid"
                                       th:data-required-when="|open-${row.index}|"
                                       th:data-after="|openTime-${row.index}|"
                                       th:data-after-message="#{business.schedule.close-before-open}">
                                <div class="invalid-feedback" th:errors="*{days[__${row.index}__].closeTime}"></div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-primary" th:text="#{business.schedule.submit}">Guardar horario</button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
