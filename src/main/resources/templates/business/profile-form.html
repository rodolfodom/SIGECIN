<!DOCTYPE html>
<!--/* Alta (setup = true) y edición del negocio */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${setup} ? #{business.setup.title} : #{business.edit.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div class="form-page mx-auto">
        <div th:replace="~{layout/base :: flash}"></div>

        <h1 class="h3 mb-1" th:text="${setup} ? #{business.setup.title} : #{business.edit.title}">Registra tu negocio</h1>
        <p class="text-body-secondary mb-4" th:if="${setup}" th:text="#{business.setup.intro}">Introducción</p>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form th:action="${setup} ? @{/business/setup} : @{/business/profile/edit}" th:object="${businessForm}"
                      method="post" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label" th:text="#{field.business.name}">Nombre del negocio</label>
                        <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid"
                               maxlength="150" required>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="categoryId" class="form-label" th:text="#{field.business.category}">Categoría</label>
                        <select class="form-select" th:field="*{categoryId}" th:errorclass="is-invalid" required>
                            <option value="" th:text="#{action.select}">Selecciona…</option>
                            <option th:each="category : ${categories}" th:value="${category.id}"
                                    th:text="${category.name}">Barbería</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <span th:text="#{field.business.description}">Descripción</span>
                            <span class="text-body-secondary small" th:text="#{field.optional}">(opcional)</span>
                        </label>
                        <textarea class="form-control" th:field="*{description}" th:errorclass="is-invalid"
                                  rows="3" maxlength="1000"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="phone" class="form-label">
                                <span th:text="#{field.business.phone}">Teléfono</span>
                                <span class="text-body-secondary small" th:text="#{field.optional}">(opcional)</span>
                            </label>
                            <input type="tel" class="form-control" th:field="*{phone}" th:errorclass="is-invalid"
                                   maxlength="20" th:pattern="${phonePattern}"
                                   th:data-pattern-message="#{Pattern.businessForm.phone}" autocomplete="tel">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-8">
                            <label for="address" class="form-label">
                                <span th:text="#{field.business.address}">Dirección</span>
                                <span class="text-body-secondary small" th:text="#{field.optional}">(opcional)</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{address}" th:errorclass="is-invalid"
                                   maxlength="255" autocomplete="street-address">
                            <div class="invalid-feedback" th:errors="*{address}"></div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a th:unless="${setup}" class="btn btn-outline-secondary" th:href="@{/business/profile}"
                           th:text="#{action.cancel}">Cancelar</a>
                        <button type="submit" class="btn btn-primary"
                                th:text="${setup} ? #{business.setup.submit} : #{action.save}">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
