<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{business.deactivate.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div class="form-page mx-auto">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 text-danger" th:text="#{business.deactivate.title}">Dar de baja el negocio</h1>
                <p th:text="#{business.deactivate.confirm(${business.name})}">¿Seguro?</p>

                <div th:if="${appointmentsToCancel > 0}" class="alert alert-danger">
                    <strong th:text="#{business.deactivate.appointments(${appointmentsToCancel})}">Se cancelarán 3 citas</strong>
                    <div class="small" th:text="#{business.deactivate.appointments.reason}">Motivo</div>
                </div>
                <p th:if="${appointmentsToCancel == 0}" class="text-body-secondary"
                   th:text="#{business.deactivate.no-appointments}">No hay citas futuras.</p>
                <p class="small text-body-secondary" th:text="#{business.deactivate.note}">Nota</p>

                <form th:action="@{/business/profile/deactivate}" method="post" class="d-flex gap-2 justify-content-end">
                    <a class="btn btn-outline-secondary" th:href="@{/business/profile}" th:text="#{action.cancel}">Cancelar</a>
                    <button type="submit" class="btn btn-danger" th:text="#{business.deactivate.submit}">Dar de baja</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
