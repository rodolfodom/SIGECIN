<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(#{service.list.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{layout/base :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{layout/base :: flash}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 mb-0" th:text="#{service.list.title}">Servicios</h1>
        <a class="btn btn-primary" th:href="@{/business/services/new}" th:text="#{service.new}">Nuevo servicio</a>
    </div>

    <div th:if="${services.isEmpty()}" class="card shadow-sm">
        <div class="card-body text-center py-5">
            <p class="mb-3 text-body-secondary" th:text="#{service.list.empty}">Aún no tienes servicios.</p>
            <a class="btn btn-primary" th:href="@{/business/services/new}" th:text="#{service.new}">Nuevo servicio</a>
        </div>
    </div>

    <div th:unless="${services.isEmpty()}" class="card shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" th:text="#{field.service.name}">Servicio</th>
                    <th scope="col" class="text-end" th:text="#{field.service.duration}">Duración</th>
                    <th scope="col" class="text-end" th:text="#{field.service.price}">Precio</th>
                    <th scope="col" th:text="#{field.status}">Estado</th>
                    <th scope="col" class="text-end"><span class="visually-hidden" th:text="#{field.actions}">Acciones</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="service : ${services}" th:classappend="${!service.active} ? 'text-body-secondary'">
                    <td>
                        <div class="fw-semibold" th:text="${service.name}">Corte clásico</div>
                        <div class="small text-body-secondary" th:if="${service.description}" th:text="${service.description}">Descripción</div>
                    </td>
                    <td class="text-end text-nowrap" th:text="#{service.duration.value(${service.durationMin})}">30 min</td>
                    <td class="text-end text-nowrap" th:text="${'$' + #numbers.formatDecimal(service.price, 1, 'COMMA', 2, 'POINT')}">$120.00</td>
                    <td>
                        <span th:if="${service.active}" class="badge rounded-pill text-bg-success" th:text="#{status.service.ACTIVE}">Activo</span>
                        <span th:unless="${service.active}" class="badge rounded-pill text-bg-secondary" th:text="#{status.service.INACTIVE}">Inactivo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/business/services/{id}/edit(id=${service.id})}"
                           th:text="#{action.edit}">Editar</a>
                        <form class="d-inline" th:action="@{/business/services/{id}/status(id=${service.id})}" method="post">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${service.active} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                    th:text="${service.active} ? #{action.deactivate} : #{action.activate}">Desactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-body-secondary mt-3" th:text="#{service.list.note}">Nota</p>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
