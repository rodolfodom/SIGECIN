spring.application.name=sigecin

# --- Base de datos (MariaDB) ---
# Las credenciales se leen de variables de entorno; no se versionan contraseñas.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/sigecin}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# ddl_sigecin.sql es la fuente de verdad del esquema: Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.show-sql=false

# --- Thymeleaf y mensajes ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale=es_MX
spring.web.locale-resolver=fixed

# --- Autenticación (JWT de acceso + refresh token, ambos en cookies HttpOnly) ---
# En producción JWT_SECRET es obligatorio (mínimo 32 caracteres) y COOKIE_SECURE=true.
# El valor por defecto solo sirve para desarrollo.
sigecin.auth.jwt-secret=${JWT_SECRET:solo-desarrollo-cambiar-en-produccion-0123456789}
sigecin.auth.access-token-ttl=15m
sigecin.auth.refresh-token-ttl=7d
# Un token recién rotado sigue aceptándose este tiempo (peticiones simultáneas de varias pestañas)
sigecin.auth.refresh-reuse-grace=30s
sigecin.auth.access-cookie-name=SIGECIN_TOKEN
sigecin.auth.refresh-cookie-name=SIGECIN_REFRESH
sigecin.auth.cookie-secure=${COOKIE_SECURE:false}

# --- Errores (páginas propias en templates/error/) ---
server.error.whitelabel.enabled=false
